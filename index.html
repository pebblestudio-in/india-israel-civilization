<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The India-Israel Civilisations Project</title>
<meta name="description" content="An independent research and public knowledge project documenting the historical, social, cultural, economic and strategic connections between India and Israel. Every claim sourced, every correction published.">
<meta name="theme-color" content="#0f1b2d">
<meta property="og:title" content="The India-Israel Civilisations Project">
<meta property="og:description" content="The relationship did not begin in 1992. A sourced, open archive of the connections between India and Israel.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,400..700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Hebrew:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230f1b2d'/><circle cx='9' cy='21' r='3' fill='%233d82c4'/><circle cx='23' cy='11' r='3' fill='%23c98a1e'/><path d='M9 21 Q16 7 23 11' stroke='%233d82c4' stroke-width='1.4' fill='none' opacity='.8'/></svg>">
<script>
  /* set the theme before first paint so nothing flashes */
  try {
    var t = localStorage.getItem("iicp.theme");
    if (t === "archive" || t === "paper" || t === "institute")
      document.documentElement.setAttribute("data-site-theme", t);
  } catch (e) {}
</script>
</head>
<body>

<canvas id="chartbed" aria-hidden="true"></canvas>

<header class="top">
  <div class="top-in">
    <a class="brand" href="#/home">
      <span class="brand-name">INDIA <i>&times;</i> ISRAEL<i>.</i></span>
      <span class="brand-sub">History &middot; People &middot; Ideas &middot; Partnership</span>
    </a>
    <div class="top-right">
      <div class="themes" role="group" aria-label="Choose a theme">
        <button class="sw-institute" data-theme="institute" title="Institute, light" aria-label="Institute theme"></button>
        <button class="sw-archive"   data-theme="archive"   title="Archive, dark"  aria-label="Archive theme"></button>
        <button class="sw-paper"     data-theme="paper"     title="Paper, warm"    aria-label="Paper theme"></button>
      </div>
      <button class="burger" id="burger" aria-label="Open the menu" aria-expanded="false">Menu <i></i></button>
    </div>
  </div>
  <nav class="mainnav" id="mainnav" aria-label="Main"></nav>
</header>

<div class="scrim" id="scrim" aria-hidden="true"></div>
<aside class="drawer" id="drawer" aria-label="Menu">
  <div class="drawer-top"><button class="drawer-x" id="drawerx" aria-label="Close the menu">&times;</button></div>
  <div id="drawernav"></div>
</aside>

<main class="main" id="main">
  <div class="wrap"><span class="tick">Loading the record</span></div>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Dialog">
  <div class="modal-in">
    <button class="modal-x" aria-label="Close">&times;</button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="site.config.js"></script>
<script src="assets/js/news.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
